<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Fond animé — Espace Fluide</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #04050c;
    overflow: hidden;
  }
  #space-bg-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="space-bg-canvas"></canvas>

<script>
(function () {
  const canvas = document.getElementById('space-bg-canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Palette ----------
  // Cosmic deep-space palette: ink indigo base, glacial cyan + magenta "fluid" accents
  const PALETTE = [
    { core: '255,255,255', mid: '150,225,255', edge: '40,90,180' },   // ice/water blue-white
    { core: '210,255,250', mid: '80,220,210',  edge: '10,90,110' },   // aqua
    { core: '255,225,250', mid: '230,120,255', edge: '90,20,130' },   // magenta plasma
    { core: '255,245,220', mid: '255,190,120', edge: '160,60,20'  },  // warm ember (rare)
  ];

  // ---------- Starfield (parallax, twinkle) ----------
  const STAR_LAYERS = [
    { count: 140, speed: 2,  size: [0.4, 1.1], twinkle: 0.4 },
    { count: 90,  speed: 6,  size: [0.7, 1.6], twinkle: 0.7 },
    { count: 45,  speed: 14, size: [1.0, 2.2], twinkle: 1.0 },
  ];
  let stars = [];
  function initStars() {
    stars = [];
    STAR_LAYERS.forEach((layer, li) => {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          layer: li,
          r: layer.size[0] + Math.random() * (layer.size[1] - layer.size[0]),
          phase: Math.random() * Math.PI * 2,
          tw: layer.twinkle,
        });
      }
    });
  }

  // ---------- Drifting nebula clouds (soft blurred blobs) ----------
  let nebulae = [];
  function initNebulae() {
    nebulae = [
      { x: 0.2, y: 0.3, r: 0.55, hue: 'rgba(70,40,140,', vx: 0.00002, vy: 0.00001 },
      { x: 0.8, y: 0.65, r: 0.5,  hue: 'rgba(10,80,120,', vx: -0.000015, vy: 0.00002 },
      { x: 0.5, y: 0.85, r: 0.45, hue: 'rgba(120,30,90,', vx: 0.00001, vy: -0.000018 },
    ];
  }

  // ---------- Fluid particles ("air bubbles") ----------
  const PARTICLE_COUNT = 60;
  let particles = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function spawnParticle(i) {
    const pal = PALETTE[Math.random() < 0.08 ? 3 : Math.floor(Math.random() * 3)];
    const r = rand(1.5, 4.5);
    return {
      x: rand(r, W - r),
      y: rand(r, H - r),
      vx: rand(-0.35, 0.35),
      vy: rand(-0.35, 0.35),
      r,
      mass: r * r,
      pal,
      pulse: Math.random() * Math.PI * 2,
    };
  }

  function initParticles() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(spawnParticle(i));
  }

  // Collision flash ripples
  let ripples = [];

  function collide(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 0.001;
    const minDist = a.r + b.r;
    if (dist >= minDist) return;

    // separate overlap
    const overlap = (minDist - dist) / 2;
    const nx = dx / dist, ny = dy / dist;
    a.x -= nx * overlap;
    a.y -= ny * overlap;
    b.x += nx * overlap;
    b.y += ny * overlap;

    // elastic collision response (2D, along normal)
    const kx = a.vx - b.vx, ky = a.vy - b.vy;
    const p = 2 * (nx * kx + ny * ky) / (a.mass + b.mass);
    a.vx -= p * b.mass * nx;
    a.vy -= p * b.mass * ny;
    b.vx += p * a.mass * nx;
    b.vy += p * a.mass * ny;

    // gentle damping so the system doesn't run hot forever
    a.vx *= 0.985; a.vy *= 0.985;
    b.vx *= 0.985; b.vy *= 0.985;

    // spawn a soft impact ripple
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    ripples.push({
      x: mx, y: my,
      r: (a.r + b.r) * 0.4,
      maxR: (a.r + b.r) * 3.2,
      alpha: 0.4,
      pal: Math.random() < 0.5 ? a.pal : b.pal,
    });
  }

  function updateParticles(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.pulse += 0.02 * dt;

      // gentle ambient drift force (like currents of air)
      p.vx += Math.sin(p.pulse * 0.5 + p.y * 0.002) * 0.0025 * dt;
      p.vy += Math.cos(p.pulse * 0.4 + p.x * 0.002) * 0.0025 * dt;

      // walls
      if (p.x - p.r < 0) { p.x = p.r; p.vx *= -1; }
      if (p.x + p.r > W) { p.x = W - p.r; p.vx *= -1; }
      if (p.y - p.r < 0) { p.y = p.r; p.vy *= -1; }
      if (p.y + p.r > H) { p.y = H - p.r; p.vy *= -1; }

      // speed clamp
      const sp = Math.hypot(p.vx, p.vy);
      const maxSp = 1.6;
      if (sp > maxSp) { p.vx = (p.vx / sp) * maxSp; p.vy = (p.vy / sp) * maxSp; }
    }

    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        collide(particles[i], particles[j]);
      }
    }
  }

  // ---------- Rendering ----------
  function drawBackground() {
    // deep space base gradient
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05060f');
    g.addColorStop(0.55, '#070912');
    g.addColorStop(1, '#02030a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawNebulae(t) {
    ctx.save();
    for (const n of nebulae) {
      n.x += n.vx * t;
      n.y += n.vy * t;
      const cx = n.x * W, cy = n.y * H, rad = n.r * Math.max(W, H);
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      grad.addColorStop(0, n.hue + '0.14)');
      grad.addColorStop(0.5, n.hue + '0.05)');
      grad.addColorStop(1, n.hue + '0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function drawStars(t) {
    for (const s of stars) {
      s.x -= STAR_LAYERS[s.layer].speed * 0.001 * (16.67);
      if (s.x < -2) s.x = W + 2;
      const flicker = 0.55 + 0.45 * Math.sin(t * 0.001 * (1 + s.tw) + s.phase);
      ctx.globalAlpha = flicker;
      ctx.beginPath();
      ctx.fillStyle = '#ffffff';
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawLinks() {
    // faint energy tendrils between very close particles — reinforces "fluid" feel
    ctx.lineWidth = 1;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.hypot(dx, dy);
        const maxD = 55;
        if (d < maxD) {
          const alpha = (1 - d / maxD) * 0.06;
          ctx.strokeStyle = `rgba(${a.pal.mid},${alpha})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const p of particles) {
      const pulseR = p.r * (1 + 0.06 * Math.sin(p.pulse * 2));

      // very soft, tight halo — just enough to read as a bubble, not a light source
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, pulseR * 1.8);
      grad.addColorStop(0, `rgba(${p.pal.core},0.35)`);
      grad.addColorStop(0.4, `rgba(${p.pal.mid},0.14)`);
      grad.addColorStop(1, `rgba(${p.pal.edge},0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, pulseR * 1.8, 0, Math.PI * 2);
      ctx.fill();

      // small crisp bubble body — thin ring + faint fill, like an air bubble
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.pal.mid},0.10)`;
      ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = `rgba(${p.pal.core},0.55)`;
      ctx.lineWidth = 0.6;
      ctx.arc(p.x, p.y, pulseR, 0, Math.PI * 2);
      ctx.stroke();

      // tiny highlight point, like light catching the bubble's edge
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.pal.core},0.6)`;
      ctx.arc(p.x - pulseR * 0.35, p.y - pulseR * 0.35, Math.max(0.4, pulseR * 0.22), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawRipples(dt) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ripples = ripples.filter(r => r.alpha > 0.01);
    for (const r of ripples) {
      r.r += (r.maxR - r.r) * 0.12 * dt * 0.06;
      r.alpha *= Math.pow(0.90, dt * 0.06);
      ctx.beginPath();
      ctx.strokeStyle = `rgba(${r.pal.core},${r.alpha * 0.35})`;
      ctx.lineWidth = 0.8;
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- Main loop ----------
  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(3, (now - lastT) / 16.67);
    lastT = now;

    drawBackground();
    drawNebulae(now);
    drawStars(now);
    updateParticles(dt);
    drawLinks();
    drawRipples(dt);
    drawParticles();

    requestAnimationFrame(frame);
  }

  initStars();
  initNebulae();
  initParticles();
  requestAnimationFrame(frame);

  // Keep star/particle positions sane on resize
  window.addEventListener('resize', () => {
    initStars();
  });
})();
</script>
</body>
</html>
